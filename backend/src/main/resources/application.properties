# spring.mail.properties.mail.debug=true desactiva la salida de depuración del correo, lo que puede ser útil para reducir el ruido en los registros en producción, pero es recomendable habilitarlo durante el desarrollo para solucionar problemas relacionados con el envío de correos electrónicos.
