<section class="admin-place-shell" aria-label="Crear lugar turistico">
  <div class="admin-heading">
    <span>Administrador</span>
    <h1>Crear lugar turístico</h1>
    <p>Registra la información principal, ubicación, categorías, actividades e imágenes del lugar.</p>
  </div>

  <app-tourist-place-form
    [(name)]="name"
    [(description)]="description"
    [(duration)]="duration"
    [(environment)]="environment"
    [(country)]="country"
    [(department)]="department"
    [(city)]="city"
    [(latitude)]="latitude"
    [(longitude)]="longitude"
    [(newCategoryName)]="newCategoryName"
    [countries]="countries()"
    [departments]="departmentOptions()"
    [cities]="cityOptions()"
    [loadingCountries]="loadingCountries()"
    [loadingDepartments]="loadingDepartments()"
    [loadingCities]="loadingCities()"
    [categories]="categories()"
    [selectedCategoryIds]="selectedCategoryIds()"
    [newCategories]="newCategories()"
    [loadingCategories]="loadingCategories()"
    [activities]="activities()"
    [photos]="photos()"
    [saving]="saving()"
    [message]="message()"
    [error]="error()"
    submitLabel="Crear lugar"
    (countrySelected)="onCountryChange($event)"
    (departmentSelected)="onDepartmentChange($event)"
    (categoryToggled)="toggleCategory($event.categoryId, $event.checked)"
    (newCategoryAdded)="addNewCategory()"
    (newCategoryRemoved)="removeNewCategory($event)"
    (activityAdded)="addActivity()"
    (activityUpdated)="updateActivity($event.index, $event.value)"
    (activityRemoved)="removeActivity($event)"
    (photoAdded)="addPhoto()"
    (photoUpdated)="updatePhoto($event.index, $event.field, $event.value)"
    (photoRemoved)="removePhoto($event)"
    (formSubmitted)="submit()"
  ></app-tourist-place-form>
</section>
