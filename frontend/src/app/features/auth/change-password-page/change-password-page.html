<div class="page">
  <main class="content">
    <article class="card" aria-label="Recuperar contraseña">
      <h2 class="title">Recuperar contraseña</h2>
      <p class="subtitle">Ingrese los datos para actualizar su contraseña</p>

      <form class="form" (ngSubmit)="submit()">
        <label class="field">
          <span class="label">Correo electrónico</span>
          <input class="input" type="email" [(ngModel)]="email" name="email" autocomplete="email" />
        </label>

        <label class="field">
          <span class="label">Contraseña temporal</span>
          <input class="input" type="password" [(ngModel)]="temporaryPassword" name="temporaryPassword"
            autocomplete="current-password" placeholder="Ingrese la contraseña temporal" />
        </label>

        <div class="row-2">
          <label class="field">
            <span class="label">Nueva contraseña</span>
            <input class="input" type="password" [(ngModel)]="newPassword" name="newPassword"
              autocomplete="new-password" placeholder="Ingrese su nueva contraseña" />
          </label>

          <label class="field">
            <span class="label">Confirmar contraseña</span>
            <input class="input" type="password" [(ngModel)]="confirmPassword" name="confirmPassword"
              autocomplete="new-password" placeholder="Confirme su nueva contraseña" />
          </label>
        </div>

        <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>

        <div class="actions">
          <button class="btn btn-change-password" type="button" (click)="cancel()" [disabled]="isSubmitting">Cancelar</button>
          <button class="btn btn-cancel" type="submit" [disabled]="isSubmitting">Actualizar contraseña</button>
        </div>
      </form>
    </article>
  </main>
</div>
