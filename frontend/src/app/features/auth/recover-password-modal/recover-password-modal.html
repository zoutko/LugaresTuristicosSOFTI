<div class="modal-backdrop" *ngIf="open" (click)="close()">
  <div
    class="modal"
    role="dialog"
    aria-modal="true"
    aria-label="Recuperar contraseña"
    (click)="$event.stopPropagation()"
  >
    <h3 class="modal-title">Recuperar contraseña</h3>

    <label class="field">
      <span class="label">Correo electrónico</span>
      <input
        class="input"
        type="email"
        placeholder="Ingrese su correo"
        [(ngModel)]="email"
        [disabled]="isSubmitting"
      />
    </label>

    <p class="modal-error" *ngIf="errorMessage || localError">{{ errorMessage || localError }}</p>

    <div class="modal-actions">
      <button
        class="modal-btn modal-btn--ghost"
        type="button"
        (click)="close()"
        [disabled]="isSubmitting"
      >
        Cancelar
      </button>
      <button class="modal-btn modal-btn--primary" type="button" (click)="submit()" [disabled]="isSubmitting">
        Enviar
      </button>
    </div>
  </div>
</div>
