<section class="home-shell" aria-label="Inicio">
  <div class="hero-panel">
    <div class="hero-actions">
      <a class="hero-button" routerLink="/recorridos">
        <span>Explorar Recorridos Turisticos</span>
        <span class="arrow" aria-hidden="true"></span>
      </a>
      <a class="hero-button" routerLink="/lugares">
        <span>Explorar Lugares Turisticos</span>
        <span class="arrow" aria-hidden="true"></span>
      </a>
    </div>
  </div>

  <div class="featured-area">
    <div class="section-heading">
      <div>
        <span class="section-kicker">Recomendados</span>
        <h1>Recorridos para empezar tu viaje</h1>
        <p>Elige una experiencia destacada y descubre lugares, actividades y rutas pensadas para explorar el mundo.</p>
      </div>
      <a routerLink="/recorridos">Ver todos</a>
    </div>

    <div *ngIf="loading()" class="home-status">Cargando recorridos destacados...</div>

    <div *ngIf="!loading() && featuredTourCards().length === 0" class="home-status">
      No hay recorridos destacados para mostrar.
    </div>

    <div *ngIf="!loading() && featuredTourCards().length > 0" class="featured-grid">
      <app-tour-card
        *ngFor="let tour of featuredTourCards()"
        [tour]="tour"
        [showRemoveButton]="false"
        (view)="viewTour($event)"
      ></app-tour-card>
    </div>
  </div>
</section>
