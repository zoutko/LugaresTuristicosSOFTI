<div class="tours-page">
  <div class="tours-layout">
    <aside class="filters-sidebar">
      <h2>Filtros</h2>
      
      <div class="filter-section">
        <label class="filter-label">Buscar</label>
        <input 
          type="text" 
          class="filter-input"
          [(ngModel)]="searchTerm"
          (input)="onSearchChange()"
          placeholder="Nombre del recorrido"
        />
      </div>
      
      <div class="filter-section">
        <label class="filter-label">Precio máximo</label>
        <div class="price-input">
          <input 
            type="range" 
            [min]="0" 
            [max]="500000" 
            [step]="10000"
            [(ngModel)]="maxPrice"
            (input)="onPriceChange()"
          />
          <span class="price-value">{{ maxPrice | number }} COP</span>
        </div>
      </div>
      
      <div class="filter-section">
        <label class="filter-label">Categoría</label>
        <div class="checkbox-group">
          @for (cat of availableCategories; track cat) {
            <label class="checkbox-item">
              <input 
                type="checkbox" 
                [checked]="selectedCategories.includes(cat)"
                (change)="toggleCategory(cat)"
              />
              <span>{{ cat }}</span>
            </label>
          }
        </div>
      </div>
      
      <div class="filter-section">
        <label class="filter-label">Entorno</label>
        <div class="checkbox-group">
          @for (env of environments; track env) {
            <label class="checkbox-item">
              <input 
                type="checkbox" 
                [checked]="selectedEnvironments.includes(env)"
                (change)="toggleEnvironment(env)"
              />
              <span>{{ env }}</span>
            </label>
          }
        </div>
      </div>
      
      <button class="btn-clear" (click)="clearFilters()">
        Limpiar Filtros
      </button>
    </aside>

    <main class="tours-content">
      <div *ngIf="loading" class="loading">
        Cargando recorridos...
      </div>
      
      <div *ngIf="error" class="error">
        {{ error }}
      </div>
      
      <div *ngIf="!loading && !error && filteredTours.length === 0" class="empty-state">
        <p>No se encontraron recorridos con los filtros seleccionados.</p>
        <button class="btn-clear" (click)="clearFilters()">Limpiar Filtros</button>
      </div>
      
      <div class="tours-grid" *ngIf="!loading && !error && filteredTours.length > 0">
        @for (tour of filteredTours; track tour.id) {
          <app-tour-card 
            [tour]="tour" 
            [showRemoveButton]="false"
            (view)="viewTour($event)">
          </app-tour-card>
        }
      </div>
    </main>
  </div>
</div>
