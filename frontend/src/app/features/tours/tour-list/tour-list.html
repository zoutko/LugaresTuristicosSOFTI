<div class="tours-page">
  <div class="tours-layout">
    <aside class="filters-sidebar">
      <h2><span class="filter-icon" aria-hidden="true"></span>Filtros</h2>

      <div class="filter-section">
        <label class="filter-label">Buscar</label>
        <input
          type="text"
          class="filter-input"
          [(ngModel)]="searchTerm"
          (input)="onSearchChange()"
          placeholder="Nombre o ubicación del recorrido"
        />
      </div>

      <div class="filter-section filter-section--divider">
        <label class="filter-label">Precio máximo</label>
        <div class="price-input">
          <span class="price-badge">{{ maxPrice | number:'1.0-0' }}</span>
          <input
            type="range"
            [min]="priceMin"
            [max]="priceMax"
            [step]="priceStep"
            [(ngModel)]="maxPrice"
            (input)="onPriceChange()"
          />
        </div>
      </div>

      <div class="filter-section filter-section--divider">
        <label class="filter-label">Categoría</label>
        <div class="checkbox-group checkbox-grid">
          @for (cat of availableCategories; track cat) {
            <label class="checkbox-item">
              <input
                type="checkbox"
                [checked]="selectedCategories.includes(cat)"
                (change)="toggleCategory(cat)"
              />
              <span>{{ cat }}</span>
            </label>
          }
        </div>
      </div>

      <div class="filter-section environment-section">
        <label class="filter-label">Entorno</label>
        <div class="checkbox-group">
          @for (env of environments; track env) {
            <label class="checkbox-item">
              <input
                type="checkbox"
                [checked]="selectedEnvironments.includes(env)"
                (change)="toggleEnvironment(env)"
              />
              <span>{{ environmentLabel(env) }}</span>
            </label>
          }
        </div>
      </div>

      <button class="btn-clear" (click)="clearFilters()">
        Limpiar Filtros
      </button>
    </aside>

    <main class="tours-content">
      <div *ngIf="loading" class="loading">
        Cargando recorridos...
      </div>

      <div *ngIf="error" class="error">
        {{ error }}
      </div>

      <div *ngIf="!loading && !error && filteredTours.length === 0" class="empty-state">
        <p>No se encontraron recorridos con los filtros seleccionados.</p>
        <button class="btn-clear" (click)="clearFilters()">Limpiar Filtros</button>
      </div>

      <div class="tours-grid" *ngIf="!loading && !error && filteredTours.length > 0">
        @for (tour of filteredTours; track tour.id) {
          <app-tour-card
            [tour]="tour"
            [showRemoveButton]="false"
            [isSaved]="savedIds.has(tour.id)"
            (save)="onSaveTour($event)"
            (removeSaved)="onRemoveSavedTour($event)"
            (view)="viewTour($event)">
          </app-tour-card>
        }
      </div>
    </main>
  </div>
</div>

<app-toast
  [open]="toastOpen"
  [message]="toastMessage"
  [variant]="toastVariant"
  (closed)="closeToast()">
</app-toast>
