<div class="profile-container">
  <div class="profile-card" *ngIf="!loading && !error && user">
    <h1>Mi Perfil</h1>
    
    <section class="info-section">
      <h2>Información Personal</h2>
      
      <div class="info-field">
        <label>Nombre:</label>
        <span>{{ user.profile.name }}</span>
      </div>
      
      <div class="info-field">
        <label>Correo:</label>
        <span>{{ user.email }}</span>
      </div>
      
      <div class="info-field">
        <label>Documento:</label>
        <span>{{ user.profile.document }}</span>
      </div>
    </section>

    <section class="contacts-section">
      <h2>Teléfonos registrados</h2>
      <p class="info-message">(Componente de lista de teléfonos pendiente)</p>
    </section>
  </div>

  <div *ngIf="loading" class="loading">Cargando perfil...</div>
  <div *ngIf="error" class="error">{{ error }}</div>
</div>

<app-toast
  [open]="toastOpen"
  [message]="toastMessage"
  [variant]="toastVariant"
  (closed)="closeToast()"
></app-toast>
