<div class="modal-backdrop" *ngIf="open" (click)="close()">
  <div
    class="modal"
    role="dialog"
    aria-modal="true"
    aria-label="Cambiar contraseña"
    (click)="$event.stopPropagation()"
  >
    <h3 class="modal-title">Cambiar Contraseña</h3>

    <!-- Contraseña actual -->
    <label class="field">
      <span class="label">Contraseña actual</span>
      <input
        class="input"
        type="password"
        placeholder="Ingrese su contraseña actual"
        [(ngModel)]="currentPassword"
        [disabled]="isSubmitting"
      />
    </label>

    <!-- Nueva contraseña -->
    <label class="field">
      <span class="label">Nueva contraseña</span>
      <input
        class="input"
        type="password"
        placeholder="Ingrese su nueva contraseña"
        [(ngModel)]="newPassword"
        [disabled]="isSubmitting"
      />
    </label>

    <!-- Confirmar contraseña -->
    <label class="field">
      <span class="label">Confirmar contraseña</span>
      <input
        class="input"
        type="password"
        placeholder="Confirme su nueva contraseña"
        [(ngModel)]="confirmPassword"
        [disabled]="isSubmitting"
      />
    </label>

    <p class="modal-error" *ngIf="errorMessage || localError">
      {{ errorMessage || localError }}
    </p>

    <div class="modal-actions">
      <button
        class="modal-btn modal-btn--ghost"
        type="button"
        (click)="close()"
        [disabled]="isSubmitting"
      >
        Cancelar
      </button>
      <button
        class="modal-btn modal-btn--primary"
        type="button"
        (click)="submit()"
        [disabled]="isSubmitting"
      >
        {{ isSubmitting ? 'Cambiando...' : 'Guardar' }}
      </button>
    </div>
  </div>
</div>
