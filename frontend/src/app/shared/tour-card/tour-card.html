<div class="tour-card">
  <div class="tour-image">
    <img [src]="tour.imageUrl || 'assets/images/default-tour.jpg'" [alt]="tour.name">
  </div>
  
  <div class="tour-content">
    <div class="tour-location">
      <span class="location-icon">📍</span>
      <span class="tour-city">{{ tour.city }}</span>
    </div>
    
    <h3 class="tour-title">{{ tour.name }}</h3>
    
    <div class="tour-tags">
      @for (category of tour.categories; track $index) {
        <span class="tag">{{ category }}</span>
      }
    </div>
    
    <div class="tour-price">{{ formatPrice(tour.price) }}</div>
    
    <div class="tour-actions">
      <button class="btn-view" (click)="onView()">Ver</button>
      <button class="btn-remove" *ngIf="showRemoveButton" (click)="onRemove()">Eliminar</button>
    </div>
  </div>
</div>
