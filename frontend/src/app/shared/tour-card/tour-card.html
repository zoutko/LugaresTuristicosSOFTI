
<article class="tour-card">
  <div class="image-frame">
    <button
      type="button"
      class="save-fab"
      *ngIf="!showRemoveButton"
      [class.save-fab--saved]="isSaved"
      [attr.aria-label]="isSaved ? 'Quitar de guardados' : 'Guardar recorrido'"
      [attr.title]="isSaved ? 'Quitar de guardados' : 'Guardar recorrido'"
      (click)="onToggleSaved()">
      <span class="save-fab__icon" aria-hidden="true"></span>
    </button>

    <img [src]="tour.imageUrl || fallbackImage" [alt]="tour.name" loading="lazy" (error)="useFallbackImage($event)">
  </div>

  <div class="tour-body">
    <div class="tour-content">
      <div class="tour-info">
        <div class="tour-location">
          <span class="pin" aria-hidden="true"></span>
          <span class="tour-location-text">{{ locationLabel || 'Ubicación por confirmar' }}</span>
        </div>

        <h2 class="tour-title">{{ tour.name }}</h2>

        <div class="tags">
          @for (category of visibleCategories; track $index) {
          <span>{{ category }}</span>
          }
        </div>
        <div class="tour-environment" *ngIf="tour.environment">
        {{ getEnvironmentLabel() }}
      </div>
      </div>

      

      <div class="tour-actions">
        <div class="tour-detail">
          <strong>{{ formatPrice(tour.price) }}</strong>
          <span>Por persona</span>
        </div>

        <button type="button" class="btn-view" (click)="onView()" *ngIf="mode === 'view'">Ver</button>
        <button type="button" class="btn-delete" *ngIf="showDeleteButton" (click)="onDelete()">
          <span>
            <img src="eliminar.svg" alt="eliminar" width="22" height="22">
          </span>
        </button>
        <button type="button" class="btn-remove" *ngIf="showRemoveButton" (click)="onRemove()">Eliminar</button>
        <button type="button" class="btn-edit" *ngIf="showEditButton" (click)="goToEdit()">
          <span>
              <img src="edit.svg" alt="editar" width="22" height="22">
          </span>
        </button>

      </div>
    </div>
  </div>
</article>
