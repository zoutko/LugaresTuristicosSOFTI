<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recorridos Turísticos - Iniciar Sesión</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            background: rgba(255, 255, 255, 0.98);
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
            padding: 0 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1400px;
            margin: 0 auto;
            padding: 1rem 0;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
            color: #2d5a3d;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #43a047, #2d5a3d);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
        }

        .logo-text {
            font-size: 1.4rem;
            font-weight: 700;
            color: #2d5a3d;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: #555;
            font-weight: 500;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .nav-links a:hover {
            background: #f0f0f0;
            color: #2d5a3d;
        }

        .user-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #43a047, #2d5a3d);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .user-icon:hover {
            transform: scale(1.1);
        }

        /* Main Content */
        .main-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem 2rem;
        }

        .forms-wrapper {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 3rem;
            max-width: 1200px;
            width: 100%;
        }

        .form-card {
            background: white;
            border-radius: 20px;
            padding: 3rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .form-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.4);
        }

        .form-card.login {
            background: linear-gradient(135deg, #f5f7fa 0%, #e8eef5 100%);
        }

        .form-card.register {
            background: linear-gradient(135deg, #fff5eb 0%, #ffe8d1 100%);
        }

        .form-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 2rem;
            text-align: center;
        }

        .form-title.login-title {
            color: #4a5568;
        }

        .form-title.register-title {
            color: #2d5a3d;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #2d3748;
            font-size: 0.95rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.875rem 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: white;
        }

        .form-group input:focus {
            outline: none;
            border-color: #43a047;
            box-shadow: 0 0 0 3px rgba(67, 160, 71, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .forgot-password {
            text-align: center;
            margin: 1rem 0;
        }

        .forgot-password a {
            color: #4a5568;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s ease;
        }

        .forgot-password a:hover {
            color: #2d5a3d;
            text-decoration: underline;
        }

        .submit-btn {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }

        .login-btn {
            background: linear-gradient(135deg, #4a5568, #2d3748);
            color: white;
        }

        .login-btn:hover {
            background: linear-gradient(135deg, #2d3748, #1a202c);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .register-btn {
            background: linear-gradient(135deg, #ff8c42, #ff6b35);
            color: white;
        }

        .register-btn:hover {
            background: linear-gradient(135deg, #ff6b35, #ff4500);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(255, 107, 53, 0.3);
        }

        /* Footer */
        footer {
            background: rgba(45, 90, 61, 0.95);
            color: white;
            text-align: center;
            padding: 2rem;
            margin-top: auto;
        }

        .footer-content {
            max-width: 1400px;
            margin: 0 auto;
        }

        .footer-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .footer-email {
            color: #a8e6cf;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .footer-email:hover {
            color: white;
            text-decoration: underline;
        }

        /* Responsive Design */
        @media (max-width: 900px) {
            .forms-wrapper {
                grid-template-columns: 1fr;
                max-width: 500px;
            }

            .nav-links {
                gap: 1rem;
            }

            .form-card {
                padding: 2rem;
            }
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            header {
                padding: 0 1rem;
            }

            .nav-links a {
                padding: 0.5rem;
                font-size: 0.9rem;
            }

            .logo-text {
                font-size: 1.1rem;
            }
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-card {
            animation: fadeIn 0.6s ease-out;
        }

        .form-card.register {
            animation-delay: 0.2s;
            animation-fill-mode: both;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="#" class="logo">
                <div class="logo-icon">⛰️</div>
                <span class="logo-text">Recorridos Turísticos</span>
            </a>
            <div class="nav-links">
                <a href="#inicio">Inicio</a>
                <a href="#recorridos">Recorridos</a>
                <a href="#lugares">Lugares Turísticos</a>
                <div class="user-icon">👤</div>
            </div>
        </nav>
    </header>

    <div class="main-container">
        <div class="forms-wrapper">
            <!-- Login Form -->
            <div class="form-card login">
                <h2 class="form-title login-title">Iniciar sesión</h2>
                <form>
                    <div class="form-group">
                        <label for="login-email">Correo electrónico</label>
                        <input type="email" id="login-email" placeholder="tu@email.com" required>
                    </div>
                    <div class="form-group">
                        <label for="login-password">Contraseña</label>
                        <input type="password" id="login-password" placeholder="Ingrese su contraseña" required>
                    </div>
                    <div class="forgot-password">
                        <a href="#forgot">¿Olvidó su contraseña?</a>
                    </div>
                    <button type="submit" class="submit-btn login-btn">Iniciar Sesión</button>
                </form>
            </div>

            <!-- Register Form -->
            <div class="form-card register">
                <h2 class="form-title register-title">Crear Cuenta</h2>
                <form>
                    <div class="form-group">
                        <label for="register-name">Nombre completo</label>
                        <input type="text" id="register-name" placeholder="Ingrese su nombre completo" required>
                    </div>
                    <div class="form-group">
                        <label for="register-email">Correo electrónico</label>
                        <input type="email" id="register-email" placeholder="tu@email.com" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="register-phone">Celular</label>
                            <input type="tel" id="register-phone" placeholder="300 123 4567" required>
                        </div>
                        <div class="form-group">
                            <label for="register-document">Documento</label>
                            <input type="text" id="register-document" placeholder="1234567890" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="register-password">Contraseña</label>
                            <input type="password" id="register-password" placeholder="Mínimo 8 caracteres" required>
                        </div>
                        <div class="form-group">
                            <label for="register-confirm">Confirmar contraseña</label>
                            <input type="password" id="register-confirm" placeholder="Repita la contraseña" required>
                        </div>
                    </div>
                    <button type="submit" class="submit-btn register-btn">Registrarse</button>
                </form>
            </div>
        </div>
    </div>

    <footer>
        <div class="footer-content">
            <div class="footer-title">Contáctanos</div>
            <a href="mailto:recorridosturisticos@gmail.com" class="footer-email">
                recorridosturisticos@gmail.com
            </a>
        </div>
    </footer>
</body>
</html>
